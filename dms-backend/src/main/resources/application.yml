# ============================================================
# Base configuration — profile-independent.
# Environment-specific settings (datasource, JWT secret, log levels,
# Hibernate SQL logging) live in application-dev.yml / application-prod.yml.
# Active profile defaults to 'dev'; override with SPRING_PROFILES_ACTIVE.
# ============================================================
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: dms-backend

  jackson:
    time-zone: UTC

  jpa:
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2MB
      location: ${java.io.tmpdir}

# ─── File Storage ──────────────────────────────────────────────────────────────
file:
  storage:
    upload-dir: ${FILE_UPLOAD_DIR:uploads}
    max-file-size: ${FILE_MAX_SIZE:10485760}   # 10 MB in bytes
    allowed-extensions: pdf,docx,doc,xlsx,xls,png,jpg,jpeg,txt

# ─── JWT (secret is set per-profile) ──────────────────────────────────────────
jwt:
  expiration: ${JWT_EXPIRATION:7200000}          # 2 hours
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}   # 7 days
  issuer: DMS-Application

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
  info:
    title: DMS API
    description: Enterprise Document Management System API
    version: 1.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/dms-application.log
