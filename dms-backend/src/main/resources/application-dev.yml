# ============================================================
# Development profile — local development.
# Provides localhost fallbacks so the app runs with zero env setup.
# Activated by default (spring.profiles.active=dev in application.yml).
# ============================================================
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/dms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: DMS-HikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        show_sql: false
        use_sql_comments: true
        jdbc:
          time_zone: UTC

jwt:
  # Dev-only fallback. Override with JWT_SECRET; never reuse this value anywhere real.
  secret: ${JWT_SECRET:dms-super-secret-key-must-be-at-least-256-bits-long-for-hs512-algorithm}

logging:
  level:
    com.dms: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
